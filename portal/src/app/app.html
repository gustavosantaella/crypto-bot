<div class="layout">
  <nav class="sidebar">
    <div class="brand">
      <span class="brand__logo">◈</span>
      <span class="brand__name">Crypto Bot</span>
    </div>

    <div class="market-switch">
      <button type="button"
              class="market-btn"
              [class.market-btn--active]="marketType() === 'SPOT'"
              (click)="marketType() !== 'SPOT' && toggleMarketType()">
        Spot
      </button>
      <button type="button"
              class="market-btn"
              [class.market-btn--active]="marketType() === 'FUTURES'"
              (click)="marketType() !== 'FUTURES' && toggleMarketType()">
        Futuros
      </button>
    </div>

    <ul class="nav">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      </li>
      <li>
        <a routerLink="/transactions" routerLinkActive="active">Transacciones</a>
      </li>
    </ul>

    <div class="ambient">
      <span class="ambient__label">TESTNET</span>
      <button type="button" class="switch" [class.switch--on]="!testMode()" (click)="toggleAmbient()"
              [attr.aria-pressed]="!testMode()"
              [attr.aria-label]="testMode() ? 'Cambiar a producción' : 'Cambiar a testnet'">
        <span class="switch__knob"></span>
      </button>
      <span class="ambient__label">PROD</span>
    </div>
    <p class="ambient__hint">Viendo: {{ testMode() ? 'Testnet' : 'Producción' }} · {{ marketType() }}</p>

    <div class="price">
      <span class="price__label">{{ price()?.symbol ?? '…' }} · en vivo</span>
      <span class="price__value">{{ price()?.price != null ? (price()!.price | num:2) : '—' }}</span>
    </div>

    <p class="sidebar__foot">Bot spot y futuros · Binance</p>
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
